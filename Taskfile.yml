version: "3"

tasks:
  install:
    desc: Install npm dependencies
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  build:
    desc: Type-check and build the static site into dist/
    deps: [install]
    cmds:
      - npm run build
    sources:
      - index.html
      - src/**/*
      - public/**/*
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - svelte.config.js
    generates:
      - dist/index.html

  run:
    desc: Start the Vite dev server
    deps: [install]
    cmds:
      - npm run dev

  lint:
    desc: Run ESLint, the Prettier check and svelte-check
    deps: [install]
    cmds:
      - npm run lint

  test:
    desc: Run the unit tests
    deps: [install]
    cmds:
      - npm test

  e2e:
    desc: Run the Playwright e2e tests against a production build
    deps: [build]
    cmds:
      - npm run e2e

  spec:
    desc: Serve ./specs at http://localhost:8000
    cmds:
      - python3 -m http.server 8000 -d specs

  check:
    desc: Run build, lint, test and e2e; fail if any fails
    cmds:
      - task: build
      - task: lint
      - task: test
      - task: e2e
