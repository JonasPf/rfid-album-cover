<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Mock</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #fff; --fg: #1f1f1f; --muted: #6b6760; --line: #e2ddd4; --accent: #2a6f97; --warn: #b85c00; --warnbg: #fff1e0;
    --mm: 3px; --inset: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #18191b; --panel: #222427; --fg: #e8e6e1; --muted: #a09c94; --line: #34363a; --accent: #7cb7dc; --warn: #ffb15c; --warnbg: #3a2a14; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  .mocknote { background: #2a6f97; color: #fff; font-size: 13px; padding: 6px 16px; }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .layout { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  button, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text], input[type=search], input[type=number] { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; width: 100%; }

  /* tabs with sliding indicator + sliding panels */
  .tabs { position: relative; display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 0; color: var(--muted); }
  .tabs button[aria-selected=true] { color: var(--fg); font-weight: 600; }
  .tabs .ind { position: absolute; bottom: -1px; left: 0; width: calc(100% / 3); height: 2px; background: var(--accent); transition: transform .3s ease; }
  .tabs .ind { transform: translateX(calc(var(--tab) * 100%)); }
  .viewport { overflow: hidden; }
  .track { display: flex; align-items: flex-start; width: 300%; transition: transform .35s ease; transform: translateX(calc(var(--tab) * -100% / 3)); }
  .track > div { width: calc(100% / 3); padding: 2px; }

  .searchrow { display: flex; gap: 8px; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .result { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 6px; }
  .result .thumb { aspect-ratio: 1; border-radius: 4px; }
  .result .a { font-size: 12px; color: var(--muted); }
  .result .t { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .msg { color: var(--muted); font-size: 14px; margin-top: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 32px 16px; text-align: center; color: var(--muted); }
  .drop button { margin-top: 8px; }
  .emojis { margin-top: 12px; max-height: 420px; overflow-y: auto; }
  .emojis h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 8px 0 4px; }
  .emojigrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; }
  .emojigrid button { padding: 4px; font-size: 26px; line-height: 1; aspect-ratio: 1; border-color: transparent; }
  .emojigrid button:hover { border-color: var(--line); }
  .art.emoji { background: #fff; display: flex; align-items: center; justify-content: center; font-size: calc(43 * var(--mm)); line-height: 1; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
  .bar .count { font-weight: 600; margin-right: auto; }
  .bar label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .bar input[type=number] { width: 70px; }
  .hint { font-size: 12px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .entry { display: flex; gap: 16px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: hidden;
           animation: slidein .35s ease-out; }
  .entry.out { animation: slideout .3s ease-in forwards; }
  @keyframes slidein { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
  @keyframes slideout { to { opacity: 0; transform: translateX(80px); } }
  .fields { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fields label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .actions { display: flex; gap: 8px; }
  .warn { display: inline-block; background: var(--warnbg); color: var(--warn); font-size: 12px; border-radius: 4px; padding: 2px 6px; margin-right: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; border: 2px dashed var(--line); border-radius: 8px; }

  /* sticker preview: card outline (54 x 85.6 mm) with inset sticker */
  .card { flex: none; width: calc(54 * var(--mm)); height: calc(85.6 * var(--mm)); border-radius: calc(3.18 * var(--mm));
          border: 1px solid #c9c4ba; background: #fff; display: flex; align-items: center; justify-content: center; }
  .sticker { width: calc((54 - 2 * var(--inset)) * var(--mm)); height: calc((85.6 - 2 * var(--inset)) * var(--mm));
             display: flex; flex-direction: column; outline: 1px dashed #0003; transition: width .2s, height .2s; }
  .art { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; }
  .text { height: calc(31.6 * var(--mm)); padding: calc(2.5 * var(--mm)) calc(3 * var(--mm)); overflow: hidden;
          display: flex; flex-direction: column; justify-content: center; color: #111; font-family: Inter, system-ui, sans-serif; }
  .text .ar { color: #555; line-height: 1.15; }
  .text .ti { font-weight: 700; line-height: 1.15; }

  /* crop dialog slides up */
  .scrim { position: fixed; inset: 0; background: #0007; display: none; align-items: flex-end; justify-content: center; }
  .scrim.open { display: flex; }
  .dialog { background: var(--panel); border-radius: 12px 12px 0 0; padding: 16px; width: min(440px, 100%); animation: slideup .3s ease-out; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .frame { width: 100%; aspect-ratio: 1; border-radius: 4px; overflow: hidden; position: relative; cursor: grab; background: #000; touch-action: none; }
  .frame .img { position: absolute; top: 0; left: 0; width: 177.78%; height: 100%; background: var(--sample); background-size: 100% 100%; }
  .frame::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px #fff8; pointer-events: none; }
  .zoom { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; }
  .zoom input { flex: 1; }
  .dlgactions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="mocknote">UI mock. Interactive enough to show the flows; no real search, upload or PDF.</div>
<header>
  <h1>RFID Album Cover</h1>
  <p>Print album covers as stickers for RFID cards.</p>
</header>

<div class="layout">
  <section class="panel" aria-label="Add cards">
    <h2>Add cards</h2>
    <div class="tabs" id="tabs" style="--tab: 0" role="tablist">
      <button role="tab" aria-selected="true" data-i="0">Search</button>
      <button role="tab" aria-selected="false" data-i="1">Upload</button>
      <button role="tab" aria-selected="false" data-i="2">Emoji</button>
      <span class="ind"></span>
    </div>
    <div class="viewport" id="vp" style="--tab: 0">
      <div class="track">
        <div>
          <form class="searchrow" id="sform">
            <input type="search" id="q" placeholder="Artist or album" value="beatles">
            <button class="primary">Search</button>
          </form>
          <div class="results" id="results"></div>
        </div>
        <div>
          <div class="drop">
            Drop images here<br><span class="hint">JPEG, PNG or WebP</span><br>
            <button id="choose">Choose files…</button>
          </div>
        </div>
        <div>
          <input type="search" id="eq" placeholder="Search emoji" aria-label="Search emoji">
          <div class="emojis" id="emojis"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Cards">
    <div class="bar">
      <span class="count" id="count"></span>
      <label>Inset (mm) <input type="number" id="inset" min="0" max="3" step="0.1" value="1.5"></label>
      <div>
        <button class="primary" id="pdf">Download PDF</button>
        <div class="hint">Print at 100 % / Actual size</div>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="scrim" id="scrim">
  <div class="dialog" role="dialog" aria-label="Crop image">
    <h2 id="dlgtitle">Crop image</h2>
    <div class="frame" id="frame"><div class="img" id="cimg"></div></div>
    <div class="zoom">Zoom <input type="range" id="zoom" min="1" max="8" step="0.01" value="1"></div>
    <div class="dlgactions">
      <button id="cancel">Cancel</button>
      <button class="primary" id="ok">Add card</button>
    </div>
  </div>
</div>

<script>
const covers = [
  "linear-gradient(135deg,#1d3557,#457b9d 60%,#e63946)",
  "repeating-linear-gradient(45deg,#2a9d8f 0 12px,#264653 0 24px)",
  "radial-gradient(circle at 50% 45%,#ffd166 0 22%,#ef476f 23% 40%,#073b4c 41%)",
  "linear-gradient(#f4a261 0 50%,#e76f51 50%)",
  "conic-gradient(from 45deg,#8338ec,#3a86ff,#06d6a0,#8338ec)",
  "linear-gradient(90deg,#222 0 33%,#eee 33% 66%,#c1121f 66%)",
];
const albums = [
  ["The Beatles", "Abbey Road"], ["The Beatles", "Sgt. Pepper's Lonely Hearts Club Band (Super Deluxe Edition, Remastered)"],
  ["The Beatles", "Revolver"], ["The Beatles", "Let It Be"], ["The Beatles", "Rubber Soul"], ["The Beatles", "Help!"],
];
document.documentElement.style.setProperty("--sample", "radial-gradient(circle at 72% 28%, #ffe066 0 5%, transparent 5.5%), radial-gradient(ellipse at 30% 100%, #3d7a2e 0 40%, transparent 41%), linear-gradient(#87b7e0 0 60%, #5c9a48 60%)");

let cards = [];
let nextId = 1;
let editing = null;

const $ = (id) => document.getElementById(id);

// tabs
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const i = b.dataset.i;
  $("tabs").style.setProperty("--tab", i); $("vp").style.setProperty("--tab", i);
  $("tabs").querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", x === b));
});

// search
function renderResults() {
  const r = $("results"); r.innerHTML = "";
  albums.forEach(([a, t], i) => {
    const b = document.createElement("button");
    b.className = "result";
    b.innerHTML = `<div class="thumb" style="background:${covers[i]}"></div><span class="a"></span><span class="t"></span>`;
    b.querySelector(".a").textContent = a; b.querySelector(".t").textContent = t;
    b.onclick = () => addCard({ artist: a, title: t, art: covers[i], lowres: false });
    r.appendChild(b);
  });
}
$("sform").addEventListener("submit", (e) => { e.preventDefault(); renderResults(); });
renderResults();

// emoji (the real picker shows Noto graphics; the mock uses the system font)
const emojiGroups = [
  ["Smileys & emotion", [["😀", "Grinning face"], ["😂", "Face with tears of joy"], ["🥰", "Smiling face with hearts"], ["😴", "Sleeping face"], ["🤠", "Cowboy hat face"]]],
  ["Animals & nature", [["🦁", "Lion", "leo"], ["🐯", "Tiger face"], ["🦭", "Seal", "sea lion"], ["🐘", "Elephant"], ["🦄", "Unicorn"], ["🌻", "Sunflower"]]],
  ["Travel & places", [["🚀", "Rocket"], ["🚂", "Locomotive"], ["🏰", "Castle"], ["🌈", "Rainbow"]]],
  ["Symbols", [["♌", "Leo", "lion"], ["❤️", "Red heart"], ["🔴", "Red circle"], ["➖", "Minus"]]],
];
function renderEmoji() {
  const q = $("eq").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const box = $("emojis"); box.innerHTML = "";
  let shown = 0;
  for (const [group, list] of emojiGroups) {
    const hits = list.filter(([, name, kw = ""]) => q.every((w) => `${name} ${kw}`.toLowerCase().split(/\s+/).some((t) => t.startsWith(w))));
    if (!hits.length) continue;
    if (!q.length) { const h = document.createElement("h3"); h.textContent = group; box.appendChild(h); }
    const grid = document.createElement("div"); grid.className = "emojigrid";
    for (const [e, name] of hits) {
      const b = document.createElement("button"); b.textContent = e; b.title = name; b.setAttribute("aria-label", name);
      b.onclick = () => addCard({ artist: "", title: "", emoji: e, lowres: false });
      grid.appendChild(b); shown++;
    }
    box.appendChild(grid);
  }
  if (!shown) box.innerHTML = `<p class="msg">No emoji found</p>`;
}
$("eq").addEventListener("input", renderEmoji);
renderEmoji();

// cards
function addCard(c) { cards.push({ id: nextId++, ...c }); renderList(c.focus ? cards.at(-1).id : null); }
function renderCount() {
  const n = cards.length, s = Math.ceil(n / 9);
  $("count").textContent = `${n} card${n === 1 ? "" : "s"} · ${s} sheet${s === 1 ? "" : "s"}`;
  $("pdf").disabled = n === 0;
}
function fit(entry) {
  const text = entry.querySelector(".text"), ti = text.querySelector(".ti"), ar = text.querySelector(".ar");
  const mm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mm"));
  const ptToPx = (pt) => pt * 0.3528 * mm;
  let size = 11, ok = false;
  for (; size >= 7; size -= 0.5) {
    ti.style.fontSize = ptToPx(size) + "px"; ar.style.fontSize = ptToPx(size * 0.75) + "px";
    if (text.scrollHeight <= text.clientHeight + 1 && text.scrollWidth <= text.clientWidth + 1) { ok = true; break; }
  }
  if (!ok) { ti.style.fontSize = ptToPx(7) + "px"; ar.style.fontSize = ptToPx(5.25) + "px"; }
  return ok;
}
function renderWarnings(entry, c) {
  const w = entry.querySelector(".warns"); w.innerHTML = "";
  if (!fit(entry)) w.innerHTML += `<span class="warn">Text too long</span>`;
  if (c.lowres) w.innerHTML += `<span class="warn">Low resolution (124 dpi)</span>`;
}
function renderList(focusId) {
  renderCount();
  const list = $("list");
  if (!cards.length) { list.innerHTML = `<div class="empty">No cards yet. Search for an album, upload an image or pick an emoji.</div>`; return; }
  list.querySelector(".empty")?.remove();
  const have = new Set([...list.children].map((e) => +e.dataset.id));
  cards.forEach((c) => {
    if (have.has(c.id)) return;
    const e = document.createElement("div");
    e.className = "entry"; e.dataset.id = c.id;
    e.innerHTML = `
      <div class="card"><div class="sticker">${c.emoji ? `<div class="art emoji">${c.emoji}</div>` : `<div class="art" style="background:${c.art};background-size:${c.size || "cover"};background-position:${c.pos || "center"}"></div>`}
        <div class="text"><div class="ar"></div><div class="ti"></div></div></div></div>
      <div class="fields">
        <label>Artist <input type="text" class="fa"></label>
        <label>Title <input type="text" class="ft"></label>
        <div class="warns"></div>
        <div class="actions"><button class="recrop">Re-crop</button><button class="rm">Remove</button></div>
      </div>`;
    const fa = e.querySelector(".fa"), ft = e.querySelector(".ft");
    fa.value = c.artist; ft.value = c.title;
    e.querySelector(".ar").textContent = c.artist; e.querySelector(".ti").textContent = c.title;
    fa.oninput = () => { c.artist = fa.value; e.querySelector(".ar").textContent = fa.value; renderWarnings(e, c); };
    ft.oninput = () => { c.title = ft.value; e.querySelector(".ti").textContent = ft.value; renderWarnings(e, c); };
    e.querySelector(".rm").onclick = () => {
      e.classList.add("out");
      e.addEventListener("animationend", () => { cards = cards.filter((x) => x !== c); e.remove(); renderList(); }, { once: true });
    };
    e.querySelector(".recrop").onclick = () => openCrop(c);
    list.appendChild(e);
    renderWarnings(e, c);
    if (c.id === focusId) ft.focus();
  });
}

// inset
$("inset").addEventListener("input", () => {
  const v = Math.min(3, Math.max(0, parseFloat($("inset").value) || 0));
  document.documentElement.style.setProperty("--inset", v);
  setTimeout(() => document.querySelectorAll(".entry").forEach((e) => renderWarnings(e, cards.find((c) => c.id == e.dataset.id))), 220);
});
$("inset").addEventListener("change", () => { $("inset").value = Math.min(3, Math.max(0, parseFloat($("inset").value) || 0)).toFixed(1); });

// crop dialog (mock: pan horizontally, zoom via slider)
let pan = 0.5;
function applyCrop() {
  const z = +$("zoom").value, img = $("cimg");
  img.style.width = 177.78 * z + "%"; img.style.height = 100 * z + "%";
  const fw = $("frame").clientWidth, iw = fw * 1.7778 * z, ih = fw * z;
  img.style.left = -(iw - fw) * pan + "px"; img.style.top = -(ih - fw) / 2 + "px";
}
function openCrop(card) {
  editing = card || null;
  $("dlgtitle").textContent = card ? "Re-crop image" : "Crop image";
  $("ok").textContent = card ? "Apply" : "Add card";
  pan = 0.5; $("zoom").value = 1;
  $("scrim").classList.add("open"); applyCrop();
}
function closeCrop() { $("scrim").classList.remove("open"); }
$("choose").onclick = () => openCrop(null);
$("cancel").onclick = closeCrop;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCrop(); });
$("zoom").oninput = applyCrop;
let drag = null;
$("frame").addEventListener("pointerdown", (e) => { drag = { x: e.clientX, p: pan }; $("frame").setPointerCapture(e.pointerId); });
$("frame").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const fw = $("frame").clientWidth, z = +$("zoom").value, span = fw * 1.7778 * z - fw;
  pan = Math.min(1, Math.max(0, drag.p - (e.clientX - drag.x) / span)); applyCrop();
});
$("frame").addEventListener("pointerup", () => (drag = null));
$("ok").onclick = () => {
  const z = +$("zoom").value;
  const size = `${177.78 * z}% ${100 * z}%`, pos = `${pan * 100}% 50%`;
  const art = getComputedStyle(document.documentElement).getPropertyValue("--sample");
  if (editing) {
    editing.size = size; editing.pos = pos;
    const a = document.querySelector(`.entry[data-id="${editing.id}"] .art`);
    if (a) { a.style.backgroundSize = size; a.style.backgroundPosition = pos; }
  } else {
    addCard({ artist: "", title: "", art, size, pos, lowres: false, focus: true });
  }
  closeCrop();
};

// seed: one normal card, one with long title, one low-res upload, one emoji
addCard({ artist: "The Beatles", title: "Abbey Road", art: covers[0], lowres: false });
addCard({ artist: "Rolf Zuckowski", title: "Rolfs Vogelhochzeit, Weihnachtsbäckerei und viele andere Lieder für die ganze Familie zum Mitsingen, Tanzen und Träumen", art: covers[2], lowres: false });
addCard({ artist: "", title: "Summer holiday 2025", art: getComputedStyle(document.documentElement).getPropertyValue("--sample"), size: "177.78% 100%", pos: "40% 50%", lowres: true });
addCard({ artist: "", title: "Bedtime stories", emoji: "🦁", lowres: false });
</script>
</body>
</html>
